<form
  method="post"
  action="{% url 'main:toggle_star_book' book.id %}"
  class="star-form"
>
  {% csrf_token %}
  <button
    type="submit"
    class="button button-star{% if user in book.starred_by.all %} is-starred{% endif %}"
    title="{% if book.starred_by.all %}Dibintangi oleh {{ book.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}"
  >
    <span aria-hidden="true">★</span>
    {% if user in book.starred_by.all %}Unstar{% else %}Star{% endif %}
    <span class="star-count">{{ book.starred_by.count }}</span>
  </button>
</form>
