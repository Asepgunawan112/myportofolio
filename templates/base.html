{% load static %}
<!doctype html>
<html lang="en">
  <head>
    {% block meta %} {% endblock meta %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
        <nav>
          <a href="{% url 'main:show_main' %}" class="nav-tittle">Profile</a>
          <a href="{% url 'main:show_experience' %}" class="nav-tittle"
            >Experience</a
          >
          <a href="{% url 'main:show_certificate' %}" class="nav-tittle"
            >Certificates</a
          >
          <a href="{% url 'main:show_book' %}" class="nav-tittle"
            >Pinjam Buku</a
          >
        </nav>
      </div>
    </header>
    {% block content %} {% endblock content %}
    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.
        </p>
      </div>
    </footer>
  </body>
</html>
